name: CI
on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eimsky
          POSTGRES_PASSWORD: eimsky
          POSTGRES_DB: eimsky_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eimsky" --health-interval 2s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://eimsky:eimsky@localhost:5432/eimsky_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Format
        run: test -z "$(gofmt -l cmd internal)"
      - name: Test
        run: go test -p 1 ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: End-to-end
        run: |
          cd e2e && npm install && npx playwright install --with-deps chromium && cd ..
          E2E_DATABASE_URL=$TEST_DATABASE_URL ./e2e/run.sh

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest --ci
      - run: npx expo-doctor
