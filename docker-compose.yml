# Local stack: Postgres + Eimsky. `docker compose up`, then load demo data with
# `docker compose run --rm app seed --reset`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eimsky
      POSTGRES_PASSWORD: eimsky
      POSTGRES_DB: eimsky
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eimsky"]
      interval: 2s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://eimsky:eimsky@db:5432/eimsky?sslmode=disable
      BASE_URL: http://localhost:8080
      DEV_MODE: "true"
    volumes:
      - files:/data

volumes:
  pgdata:
  files:
