{{define "auth"}}<!doctype html>
<html lang="en" data-theme="{{.Theme}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.Title}} · Eimsky</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/app.css?v={{assetVersion}}">
<script src="/static/js/app.js?v={{assetVersion}}" defer></script>
</head>
<body>
<div class="auth">
  <a class="auth-logo" href="/login" aria-label="Eimsky">{{template "logo"}}</a>
  <div class="auth-card">
    {{if .Flash}}<div class="alert {{.Flash.Kind}}" role="status" data-flash="{{.Flash.Kind}}" style="margin-bottom:16px">{{.Flash.Msg}}</div>{{end}}
    {{template "content" .}}
  </div>
  <div class="auth-foot">Pooled container imports for Sri Lankan apparel factories · © Eimsky Business Solutions</div>
</div>
</body>
</html>{{end}}
